[build]
  publish = "dist"
  command = "npm run build"

# Proxy all /api/* requests to the VPS bot
# This completely bypasses CORS and mixed content issues
[[redirects]]
  from = "/api/*"
  to = "http://13.205.205.134:8080/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
